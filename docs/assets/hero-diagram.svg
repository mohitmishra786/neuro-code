<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">NeuroCode hierarchical code graph</title>
  <desc id="desc">Dark UI mock of NeuroCode showing package, module, class, and function nodes with edges</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <!-- header bar -->
  <rect x="0" y="0" width="960" height="56" fill="#111118" fill-opacity="0.9"/>
  <text x="24" y="36" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="18" font-weight="700">NeuroCode</text>
  <rect x="200" y="14" width="320" height="28" rx="8" fill="#1a1a24" stroke="#334155"/>
  <text x="214" y="33" fill="#64748b" font-family="system-ui,sans-serif" font-size="12">Search symbols…</text>
  <!-- package -->
  <circle cx="480" cy="140" r="36" fill="#6366f1" filter="url(#glow)"/>
  <text x="480" y="145" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">P</text>
  <text x="480" y="195" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">demo_pkg</text>
  <!-- modules -->
  <line x1="480" y1="176" x2="320" y2="250" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="480" y1="176" x2="480" y2="250" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="480" y1="176" x2="640" y2="250" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="320" cy="280" r="28" fill="#8b5cf6"/>
  <text x="320" y="285" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">M</text>
  <text x="320" y="325" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">core</text>
  <circle cx="480" cy="280" r="28" fill="#8b5cf6"/>
  <text x="480" y="285" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">M</text>
  <text x="480" y="325" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">models</text>
  <circle cx="640" cy="280" r="28" fill="#8b5cf6"/>
  <text x="640" y="285" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">M</text>
  <text x="640" y="325" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">services</text>
  <!-- classes under models -->
  <line x1="480" y1="308" x2="420" y2="370" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="480" y1="308" x2="540" y2="370" stroke="#10b981" stroke-width="3" stroke-opacity="0.85"/>
  <circle cx="420" cy="400" r="24" fill="#10b981"/>
  <text x="420" y="405" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">C</text>
  <text x="420" y="440" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">User</text>
  <circle cx="540" cy="400" r="24" fill="#10b981"/>
  <text x="540" y="405" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">C</text>
  <text x="540" y="440" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">AdminUser</text>
  <!-- function under core -->
  <line x1="320" y1="308" x2="280" y2="370" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.9"/>
  <circle cx="280" cy="400" r="20" fill="#f59e0b"/>
  <text x="280" y="405" text-anchor="middle" fill="#0a0a0f" font-family="system-ui,sans-serif" font-size="10" font-weight="700">F</text>
  <text x="280" y="438" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">run_app</text>
  <!-- legend -->
  <rect x="720" y="380" width="200" height="130" rx="10" fill="#111118" fill-opacity="0.85" stroke="#334155"/>
  <text x="736" y="404" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11" font-weight="700">LEGEND</text>
  <circle cx="744" cy="428" r="6" fill="#6366f1"/><text x="758" y="432" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">Package</text>
  <circle cx="744" cy="450" r="6" fill="#8b5cf6"/><text x="758" y="454" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">Module</text>
  <circle cx="744" cy="472" r="6" fill="#10b981"/><text x="758" y="476" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">Class</text>
  <circle cx="744" cy="494" r="6" fill="#f59e0b"/><text x="758" y="498" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11">Function</text>
</svg>
