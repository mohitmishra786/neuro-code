name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        # Gate on modules we own tightly; full tree still has legacy noise
        run: >
          python -m ruff check
          api/
          utils/
          merkle/
          graph_db/
          parser/tree_sitter_parser.py
          tests/
          --output-format=github

      - name: Mypy (advisory)
        # Strict mypy is repo policy; full tree still has pre-existing type debt.
        # Report only — do not block merge until debt is paid down.
        continue-on-error: true
        run: >
          python -m mypy
          api/
          utils/
          merkle/
          graph_db/
          parser/tree_sitter_parser.py
          --config-file pyproject.toml

      - name: Pytest
        env:
          ENVIRONMENT: development
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
        run: pytest tests/ -v --tb=short -q

  frontend:
    name: Frontend (lint + tsc + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (app sources)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Vitest (full suite)
        run: npm run test -- --run
