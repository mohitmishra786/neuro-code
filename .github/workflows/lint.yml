name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ruff:
    name: Backend Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff check (primary modules)
        # Match CI scope — full tree still has legacy style debt
        run: >
          ruff check
          api/
          utils/
          merkle/
          graph_db/
          parser/tree_sitter_parser.py
          tests/
      - name: Ruff format (check only, advisory)
        run: ruff format --check . || true

  frontend-eslint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: markdownlint
        run: |
          npm install -g markdownlint-cli@0.43.0
          markdownlint \
            --config .markdownlint.json \
            "README.md" \
            "docs/**/*.md" \
            "AGENTS.md" \
            "CONTRIBUTING.md" \
            "SECURITY.md" \
            "CHANGELOG.md" \
            || true
        # Non-blocking for historical audit docs; prefer fixing new files to pass
