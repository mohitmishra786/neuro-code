[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocode"
version = "0.1.0"
description = "Interactive Hierarchical Code Visualization System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "NeuroCode Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
keywords = ["code-visualization", "ast", "graph", "neo4j", "tree-sitter"]

dependencies = [
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.1",
    "neo4j==5.17.0",
    "tree-sitter==0.21.3",
    "tree-sitter-python==0.21.2",
    "watchdog==4.0.0",
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    "structlog==24.1.0",
    "httpx==0.26.0",
    "websockets==12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=2.3.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/mohitmishra786/neuro-code"
Documentation = "https://github.com/mohitmishra786/neuro-code#readme"
Repository = "https://github.com/mohitmishra786/neuro-code"
Issues = "https://github.com/mohitmishra786/neuro-code/issues"

[project.scripts]
neurocode = "cli_main:main"

[tool.setuptools]
py-modules = ["cli_main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["parser*", "graph_db*", "merkle*", "watcher*", "api*", "utils*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "W293",   # blank line whitespace in legacy modules
    "ARG001", # unused function args (middleware processor signatures)
    "ARG002", # unused method args (API protocol compatibility)
    "SIM",    # flake8-simplify style nits (legacy volume)
    "F841",   # unused local assignment in tests/legacy
    "B007",   # unused loop variable in legacy loops
]

[tool.ruff.lint.isort]
known-first-party = ["parser", "graph_db", "merkle", "watcher", "api", "utils"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "tree_sitter_python.*",
    "neo4j.*",
    "dotenv.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
]

[tool.coverage.run]
source = ["parser", "graph_db", "merkle", "watcher", "api", "utils"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
